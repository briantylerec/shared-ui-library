name: Publish Android library
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test assembleDebug

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish tagged version
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository -PreleaseVersion="${GITHUB_REF_NAME#v}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package Maven files for the GitHub Release
        run: |
          version="${GITHUB_REF_NAME#v}"
          ./gradlew publishReleasePublicationToMavenLocal -PreleaseVersion="$version"
          mkdir -p release-assets
          cd "$HOME/.m2/repository"
          zip -r "$GITHUB_WORKSPACE/release-assets/shared-ui-${version}-maven.zip" "com/redbull/lab/shared-ui/${version}"
      - name: Create GitHub Release with Maven package
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*-maven.zip
